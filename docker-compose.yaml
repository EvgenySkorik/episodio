services:
  db:
    image: postgres:15
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d kinomovie" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  app:
    build: .
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      - POSTGRES__SERVER=db
    volumes:
      - ./static/uploads:/app/static/uploads

  worker:
    build: .
    command: uv run celery -A app.infrastructure.celery_app worker --loglevel=info
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      - POSTGRES__SERVER=db

  beat:
    build: .
    command: uv run celery -A app.infrastructure.celery_app beat --loglevel=info
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      - POSTGRES__SERVER=db

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - app

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data: